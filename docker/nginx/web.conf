# 真实客户端 IP：优先透传边缘 nginx 设置的 X-Real-IP；直连（无边缘层）时回退为对端地址
map $http_x_real_ip $goteams_client_ip {
    ""      $remote_addr;
    default $http_x_real_ip;
}

# 与 lib_storage.contentType 保持一致，新增格式仅供下载。
map $sent_http_content_type $goteams_upload_disposition {
    default "";
    application/octet-stream attachment;
}

server {
    listen       8080;
    server_name  ~.+;
    client_max_body_size 220m;

    # 本地上传文件（需求图片/附件/头像/图标等）免鉴权直接访问。
    # 与 Go 服务共享同一卷（/var/www/goteams），目录与 lib_storage 本地写入目录一致。
    location /uploads/ {
        alias /var/www/goteams/data/uploads/;
        autoindex off;
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            application/pdf pdf;
            application/msword doc;
            application/vnd.openxmlformats-officedocument.wordprocessingml.document docx;
            application/vnd.ms-excel xls;
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet xlsx;
            application/vnd.ms-powerpoint ppt;
            application/vnd.openxmlformats-officedocument.presentationml.presentation pptx;
            text/plain txt;
            text/csv csv;
            text/markdown md;
            application/zip zip;
            application/vnd.rar rar;
            application/x-7z-compressed 7z;
            video/mp4 mp4;
            video/webm webm;
        }
        default_type application/octet-stream;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Content-Disposition $goteams_upload_disposition always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Desktop client WebSocket → Go backend
    location = /api/ws/agent {
        proxy_pass http://goteams:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $goteams_client_ip;
        proxy_set_header X-Forwarded-For $goteams_client_ip;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # 手动成员同步在请求内跑完（真实企业规模下可达数分钟），单独放宽读写超时；
    # 其余 API 仍走默认 60s。前端同一个请求也单独设了 600s 超时。
    location = /api/enterprise/sso/sync/run {
        proxy_pass http://goteams:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $goteams_client_ip;
        # 始终覆写 XFF，防止客户端自带伪造头透传到 Gin
        proxy_set_header X-Forwarded-For $goteams_client_ip;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Ordinary API requests → Go backend
    location /api/ {
        proxy_pass http://goteams:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $goteams_client_ip;
        # 始终覆写 XFF，防止客户端自带伪造头透传到 Gin
        proxy_set_header X-Forwarded-For $goteams_client_ip;
        # 透传常见 CDN 的 IP 国家码，供国际站访问地区判断使用
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CloudFront-Viewer-Country $http_cloudfront_viewer_country;
        proxy_set_header X-Country-Code $http_x_country_code;
        proxy_set_header X-Forwarded-Country $http_x_forwarded_country;
        proxy_set_header X-Geo-Country $http_x_geo_country;
    }

    # 手机端接口别名：/mobile/* 由 Go 服务自动镜像到 /api/* 的同一路由处理
    location /mobile/ {
        proxy_pass http://goteams:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $goteams_client_ip;
        # 始终覆写 XFF，防止客户端自带伪造头透传到 Gin
        proxy_set_header X-Forwarded-For $goteams_client_ip;
        # 透传常见 CDN 的 IP 国家码，供国际站访问地区判断使用
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CloudFront-Viewer-Country $http_cloudfront_viewer_country;
        proxy_set_header X-Country-Code $http_x_country_code;
        proxy_set_header X-Forwarded-Country $http_x_forwarded_country;
        proxy_set_header X-Geo-Country $http_x_geo_country;
    }

    # 大文件上传（图片/文件/视频、附件、知识库文件、开放 API 素材）→ Go backend。
    # 默认 proxy_read_timeout 是 60s，而这几个入口单个文件最大 200MB：nginx 把请求体落盘转发给上游后，
    # 上游还要读完整文件再写对象存储，很容易超过 60s，结果上游还没返回就被 nginx 掐断成 504。
    # 这里与前端上传接口的超时（10 分钟）对齐。正则 location 优先于上面的 /api/ 前缀匹配。
    location ~ ^/api/(?:workspaces/[0-9]+/(?:requirements/(?:image|file|video|[0-9]+/attachments)|kb/documents/(?:from-file|[0-9]+/attachments/(?:images|files|videos)))|public/issue-invites/[^/]+/attachments|v1/workspaces/[0-9]+/assets/(?:image|file|video))$ {
        proxy_pass http://goteams:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $goteams_client_ip;
        proxy_set_header X-Forwarded-For $goteams_client_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CloudFront-Viewer-Country $http_cloudfront_viewer_country;
        proxy_set_header X-Country-Code $http_x_country_code;
        proxy_set_header X-Forwarded-Country $http_x_forwarded_country;
        proxy_set_header X-Geo-Country $http_x_geo_country;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA frontend
    location / {
        root   /var/www/goteams/web/dist;
        index  index.html;
        try_files $uri $uri/ /index.html;

        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store";
        }
    }
}
