# GoTeams 开源版 Nginx 站点配置（容器内路径由开源版 Compose 挂载决定）
# 真实客户端 IP：优先透传边缘 nginx 设置的 X-Real-IP；直连（无边缘层）时回退为对端地址
map $http_x_real_ip $goteams_client_ip {
    ""      $remote_addr;
    default $http_x_real_ip;
}

server {
    listen       8080;
    server_name  ~.+;
    client_max_body_size 110m;

    # 本地上传文件（需求图片/附件/头像/图标等）免鉴权直接访问。
    # 开源版 Compose 将宿主机 /opt/goteams/data 只读挂载到 /var/www/goteams/data。
    location /uploads/ {
        alias /var/www/goteams/data/uploads/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Desktop client WebSocket → Go backend
    location = /api/ws/agent {
        proxy_pass http://goteams:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $goteams_client_ip;
        proxy_set_header X-Forwarded-For $goteams_client_ip;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # Ordinary API requests → Go backend
    location /api/ {
        proxy_pass http://goteams:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $goteams_client_ip;
        # 始终覆写 XFF，防止客户端自带伪造头透传到 Gin
        proxy_set_header X-Forwarded-For $goteams_client_ip;
        # 透传常见 CDN 的 IP 国家码（私有化部署通常无 CDN，保留无副作用）
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CloudFront-Viewer-Country $http_cloudfront_viewer_country;
        proxy_set_header X-Country-Code $http_x_country_code;
        proxy_set_header X-Forwarded-Country $http_x_forwarded_country;
        proxy_set_header X-Geo-Country $http_x_geo_country;
    }

    # SPA frontend（goteamsctl 安装/升级时已将 dist.tar.gz 解压为 dist/）
    location / {
        root   /var/www/goteams/web/dist;
        index  index.html;
        try_files $uri $uri/ /index.html;

        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store";
        }
    }
}
