; GoTeams 部署配置（默认适配 docker/docker-compose.yml）。
; 数据库与 Redis 密码必须和 docker/.env 保持一致；对外访问地址修改 site_url。
; 对象存储、扫码登录、SSO、会话加密等默认关闭，按需填写启用。

;webservice config
[webservice]
port = 8080
; 站点访问地址（不含结尾斜杠），用于自动化模板中的工作项链接变量；留空时链接变量渲染为空
site_url = http://127.0.0.1:8080

;session config
[session]
ttl = 604800
max_life = 2592000

;redis config
[redis]
db = 0
host = redis
port = 6379
password = goteams_redis_pass_pro

;postgres config
[postgres]
host = postgres
port = 5432
user = goteams
password = goteams_postgres_pass_pro
dbname = goteams
sslmode = disable

;oss-s3（默认使用本地存储；启用对象存储时填写）
[oss-s3]
enable = false
endpoint =
access_key =
secret_key =
bucket =
use_ssl = true
; URL styles:
; path: http(s)://{endpoint}/{bucket}/{objectKey} (example: http://localhost:9000/my-bucket/a.png)
; virtual_hosted: http(s)://{bucket}.{endpoint}/{objectKey} (example: https://my-bucket.s3.example.com/a.png)
; cname: http(s)://{custom_domain}/{objectKey} (example: https://static.example.com/a.png)
url_style = path
; Required only when url_style=cname. Configure the host without http:// or https://.
custom_domain =
; Optional. Public endpoint for generating access URLs returned to clients.
; When empty, endpoint is used for both upload and access URL generation.
public_endpoint =
; Optional. Set to 1 to return temporary signed URLs for oss objects; both signing keys are required.
aliyun_url_sign = 0
aliyun_pub_access_key =
aliyun_pub_secret_key =

;邮件网关（可选；留空时邮件相关功能不可用）
[email]
url =
timeout = 30
from_username =
from_password =
from_host =
from_port = 465

;客户端配置（可选；下载地址留空时客户端发布列表为空，device_secret 留空时回退内置默认值）
[client]
device_secret =
darwin_amd64_url  =
darwin_arm64_url  =
windows_amd64_url =
windows_arm64_url =

[oauth]
; 第三方账号扫码登录公共配置（钉钉 / 飞书）
; 站点对外地址复用 [webservice] 的 site_url，用于拼接回调地址与登录完成后的回跳
state_ttl = 600
bind_ticket_ttl = 600
login_ticket_ttl = 120

[dingtalk]
; 钉钉开放平台自建应用凭证：开发者后台 → 应用开发 → 钉钉应用 → 凭证与基础信息
enable = false
app_key =
app_secret =

[feishu]
; 飞书开放平台自建应用凭证：开发者后台 → 凭证与基础信息
enable = false
app_id =
app_secret =

[scheduler]
; 定时任务执行层的并发上限：同时在跑的任务数不会超过这个值，待执行的任务留在表里排队。
; 缺省或非法值按 50 运行。
concurrency = 50

[sso]
; 登录入口 scope_id 的 AES-256-GCM 密钥：64 位十六进制（32 字节），用 openssl rand -hex 32 生成。
; 缺失或长度非法时不 panic，入口地址为空；部署时按需填写。
scope_id_key =
; 部署级 SSRF 放行网段，逗号分隔 CIDR；默认空 = 私网全拒。
allow_cidrs =

;会话正文存储加密（可选；每个部署自行生成并保管主密钥，留空时不加密）
[session-encryption]
master_key =

;默认管理员（仅首次启动且库内无根租户时创建；首次登录后强制改密）
[account]
admin_username = admin
admin_password = admin123456
admin_name = Admin

;开源版授权
[license]
;运营后台在线激活接口地址
activation_url = https://xiaokefu.com.cn
;在线请求超时（秒）
request_timeout_seconds = 10
;在线授权定期复核间隔（秒），默认 6 小时
refresh_interval_seconds = 21600
;设备实例标识文件路径（持久化随机 instance_id，跨安装升级必须保持不变）
instance_id_file = data/license/instance_id
;启动时待安装授权 Key 文件（运维人工放置，成功消费后自动删除；留空禁用）
pending_key_file = data/license/pending.key
