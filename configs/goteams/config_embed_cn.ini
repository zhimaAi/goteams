; GoTeams 开源版 CN 环境内嵌配置（构建时以 -tags commercial_embed 打进可执行文件）。
; 构建入口：scripts/build-commercial-package.bat cn。
; 安装后如需单键覆盖，可由 goteamsctl 维护的 .env 经 docker-compose 注入
; GOTEAMS_<段>_<键> 环境变量（如 GOTEAMS_WEBSERVICE_SITE_URL），空值忽略；
; 注意 docker-compose.yml 中 postgres/redis 的默认密码必须与本文件保持一致。
; 新增 [account]/[license] 配置键时直接更新本文件。

;webservice config
[webservice]
port = 8080
; 站点访问地址（不含结尾斜杠），用于自动化模板中的工作项链接变量
site_url = http://127.0.0.1:8080

;session config
[session]
ttl = 604800
max_life = 2592000

;redis config
[redis]
db = 0
host = redis
port = 6379
password = ddyxBQFkrjs9llYnAQ4eqVJNG5B9jTp7

;postgres config
[postgres]
host = postgres
port = 5432
user = goteams
password = ddyxBQFkrjs9llYnAQ4eqVJNG5B9jTp7
dbname = goteams
sslmode = disable

;oss-s3（私有化默认本地存储；如需对象存储通过 GOTEAMS_OSS_S3_* 环境变量按需覆盖）
[oss-s3]
enable = false
endpoint =
access_key =
secret_key =
bucket =
use_ssl = true
url_style = path
custom_domain =
public_endpoint =

;会话正文存储加密（可选；每个实例自行生成并保管主密钥，安装包不内置）
[session-encryption]
master_key =

;邮件网关（在线试用验证码依赖；纯离线部署可留空）
[email]
url =
timeout = 30
from_username =
from_password =
from_host =
from_port = 465

;开源版默认管理员（仅首次启动且库内无根租户时创建；首次登录后走 first_login 强制改密）
[account]
admin_username = admin
admin_password = admin123456
admin_name = Admin

;开源版授权
[license]
;构建环境标识，仅用于打包结果校验
build_environment = cn
;运营后台在线激活接口地址
activation_url = https://xiaokefu.com.cn
;在线请求超时（秒）
request_timeout_seconds = 10
;在线授权定期复核间隔（秒），默认 6 小时
refresh_interval_seconds = 21600
;客服二维码地址（/license 页展示）
contact_qr_url = /assets/customer-service-qr.png
;设备实例标识文件路径（持久化随机 instance_id，跨安装升级必须保持不变）
instance_id_file = /var/www/goteams/data/license/instance_id
;启动时待安装授权 Key 文件（运维人工放置，成功消费后自动删除；留空禁用）
pending_key_file = /var/www/goteams/data/license/pending.key
